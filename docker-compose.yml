name: webconsig

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      APP_ENV: production
      APP_DEBUG: "false"
      API_WORKERS: ${API_WORKERS:-4}
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      AUTH_ALLOW_DEV_HEADER_FALLBACK: ${AUTH_ALLOW_DEV_HEADER_FALLBACK:-true}
      AUTHZ_ENABLED: ${AUTHZ_ENABLED:-true}
      KEYCLOAK_BASE_URL: ${KEYCLOAK_BASE_URL:-http://keycloak:8080}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-webconsig}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-webconsig-frontend}
      KEYCLOAK_VERIFY_TLS: ${KEYCLOAK_VERIFY_TLS:-false}
      KEYCLOAK_JWKS_CACHE_SECONDS: ${KEYCLOAK_JWKS_CACHE_SECONDS:-300}
    expose:
      - "8001"
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
        VITE_AUTH_MODE: ${VITE_AUTH_MODE:-keycloak}
        VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL:-https://localhost:15443/auth}
        VITE_KEYCLOAK_REALM: ${VITE_KEYCLOAK_REALM:-webconsig}
        VITE_KEYCLOAK_CLIENT_ID: ${VITE_KEYCLOAK_CLIENT_ID:-webconsig-frontend}
    depends_on:
      - api
      - keycloak
    expose:
      - "80"
    restart: unless-stopped

  gateway:
    build:
      context: ./infra/nginx
      dockerfile: Dockerfile
    depends_on:
      - api
      - web
      - keycloak
    environment:
      HTTPS_DOMAIN: ${HTTPS_DOMAIN:-localhost}
      HTTPS_ADMIN_USER: ${HTTPS_ADMIN_USER:-admin}
      HTTPS_ADMIN_PASSWORD: ${HTTPS_ADMIN_PASSWORD:-Admin@123!ChangeMe}
    ports:
      - "${HTTPS_PORT:-15443}:443"
    restart: unless-stopped

  postgres:
    image: postgres:16
    profiles: ["local-infra"]
    environment:
      POSTGRES_DB: webconsig
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    profiles: ["local-infra"]
    ports:
      - "${REDIS_PORT:-16379}:6379"
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    command: ["start-dev", "--import-realm", "--http-relative-path=/auth"]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-Admin@123!ChangeMe}
    ports:
      - "${KEYCLOAK_PORT:-18080}:8080"
    volumes:
      - ./infra/keycloak/realm-webconsig.json:/opt/keycloak/data/import/realm-webconsig.json:ro
    restart: unless-stopped

volumes:
  pg_data:
