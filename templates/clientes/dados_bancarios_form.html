{% extends "layouts/base.html" %}

{% block title %}{{ title }} | {{ system.app_name }}{% endblock %}

{% block content %}
<div class="page-header d-print-none">
    <div class="container-xl">
        <div class="row g-2 align-items-center">
            <div class="col">
                <div class="page-pretitle">
                    <a href="{{ url_for('clientes_blueprint.cliente_view', cpf=cliente.cpf) }}">{{ cliente.nome_completo }}</a>
                </div>
                <h2 class="page-title">
                    <i class="ti ti-building-bank me-2"></i>
                    {{ title }}
                </h2>
            </div>
        </div>
    </div>
</div>

<div class="page-body">
    <div class="container-xl">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <form method="POST" class="card">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    
                    <div class="card-body">
                        <div class="row g-3">
                            <div class="col-md-3">
                                <label class="form-label">Código do Banco</label>
                                <input type="text" name="numero_banco" class="form-control" 
                                       value="{{ form.numero_banco.data or '' }}"
                                       placeholder="001">
                            </div>
                            
                            <div class="col-md-9">
                                <label class="form-label">Nome do Banco</label>
                                <input type="text" name="banco" class="form-control" 
                                       value="{{ form.banco.data or '' }}"
                                       placeholder="Banco do Brasil, Caixa, etc.">
                            </div>
                            
                            <div class="col-md-4">
                                <label class="form-label">Agência</label>
                                <input type="text" name="agencia" class="form-control" 
                                       value="{{ form.agencia.data or '' }}"
                                       placeholder="0000">
                            </div>
                            
                            <div class="col-md-4">
                                <label class="form-label">Conta</label>
                                <input type="text" name="conta" class="form-control" 
                                       value="{{ form.conta.data or '' }}"
                                       placeholder="00000-0">
                            </div>
                            
                            <div class="col-md-4">
                                <label class="form-label">Data de Abertura</label>
                                <input type="text" name="data_abertura" class="form-control" 
                                       value="{{ form.data_abertura.data or '' }}"
                                       placeholder="DD/MM/AAAA">
                            </div>
                            
                            <div class="col-12">
                                <label class="form-label">Chave PIX</label>
                                <input type="text" name="chave_pix" class="form-control" 
                                       value="{{ form.chave_pix.data or '' }}"
                                       placeholder="CPF, email, telefone ou chave aleatória">
                            </div>
                        </div>
                    </div>
                    
                    <div class="card-footer text-end">
                        <a href="{{ url_for('clientes_blueprint.cliente_view', cpf=cliente.cpf) }}" class="btn btn-ghost-secondary me-2">
                            Cancelar
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="ti ti-device-floppy me-1"></i> Salvar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
