{% extends "layouts/base.html" %}

{% block title %}{{ title }} | {{ system.app_name }}{% endblock %}

{% block content %}
<div class="page-header d-print-none">
    <div class="container-xl">
        <div class="row g-2 align-items-center">
            <div class="col">
                <div class="page-pretitle">
                    <a href="{{ url_for('clientes_blueprint.cliente_view', cpf=cliente.cpf) }}">{{ cliente.nome_completo }}</a>
                </div>
                <h2 class="page-title">
                    <i class="ti ti-cake me-2"></i>
                    {{ title }}
                </h2>
            </div>
        </div>
    </div>
</div>

<div class="page-body">
    <div class="container-xl">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <form method="POST" class="card">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    
                    <div class="card-body">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Data de Nascimento</label>
                                <input type="text" name="data_nasc" class="form-control" 
                                       value="{{ form.data_nasc.data or '' }}"
                                       placeholder="DD/MM/AAAA">
                            </div>
                            
                            <div class="col-md-3">
                                <label class="form-label">Idade</label>
                                <input type="number" name="idade" class="form-control" 
                                       value="{{ form.idade.data or '' }}">
                            </div>
                            
                            <div class="col-md-3">
                                <label class="form-label">Óbito</label>
                                <select name="obito" class="form-select">
                                    <option value="">Não</option>
                                    <option value="SIM" {% if form.obito.data == 'SIM' %}selected{% endif %}>Sim</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    
                    <div class="card-footer text-end">
                        <a href="{{ url_for('clientes_blueprint.cliente_view', cpf=cliente.cpf) }}" class="btn btn-ghost-secondary me-2">
                            Cancelar
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="ti ti-device-floppy me-1"></i> Salvar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
