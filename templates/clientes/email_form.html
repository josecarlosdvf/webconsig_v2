{% extends "layouts/base.html" %}

{% block title %}{{ title }} | {{ system.app_name }}{% endblock %}

{% block content %}
<div class="page-header d-print-none">
    <div class="container-xl">
        <div class="row g-2 align-items-center">
            <div class="col">
                <div class="page-pretitle">
                    <a href="{{ url_for('clientes_blueprint.cliente_view', cpf=cliente.cpf) }}">{{ cliente.nome_completo }}</a>
                </div>
                <h2 class="page-title">
                    <i class="ti ti-mail me-2"></i>
                    {{ title }}
                </h2>
            </div>
        </div>
    </div>
</div>

<div class="page-body">
    <div class="container-xl">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <form method="POST" class="card">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    
                    <div class="card-body">
                        <div class="row g-3">
                            <div class="col-md-8">
                                <label class="form-label">Email</label>
                                <input type="email" name="email" class="form-control" 
                                       value="{{ form.email.data or '' }}"
                                       placeholder="email@exemplo.com">
                            </div>
                            
                            <div class="col-md-4">
                                <label class="form-label">Status</label>
                                <input type="text" name="status" class="form-control" 
                                       value="{{ form.status.data or '' }}"
                                       placeholder="Ex: Ativo, Verificado">
                            </div>
                        </div>
                    </div>
                    
                    <div class="card-footer text-end">
                        <a href="{{ url_for('clientes_blueprint.cliente_view', cpf=cliente.cpf) }}" class="btn btn-ghost-secondary me-2">
                            Cancelar
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="ti ti-device-floppy me-1"></i> Salvar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
