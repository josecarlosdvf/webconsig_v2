{% extends "layouts/base.html" %}

{% block title %}{{ title }} | {{ system.app_name }}{% endblock %}

{% block content %}
<div class="page-header d-print-none">
    <div class="container-xl">
        <div class="row g-2 align-items-center">
            <div class="col">
                <div class="page-pretitle">
                    <a href="{{ url_for('clientes_blueprint.cliente_view', cpf=cliente.cpf) }}">{{ cliente.nome_completo }}</a>
                </div>
                <h2 class="page-title">
                    <i class="ti ti-map-pin me-2"></i>
                    {{ title }}
                </h2>
            </div>
        </div>
    </div>
</div>

<div class="page-body">
    <div class="container-xl">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <form method="POST" class="card">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    
                    <div class="card-body">
                        <div class="row g-3">
                            <div class="col-md-3">
                                <label class="form-label">CEP</label>
                                <input type="text" name="cep" class="form-control" 
                                       value="{{ form.cep.data or '' }}"
                                       placeholder="00000-000">
                            </div>
                            
                            <div class="col-md-7">
                                <label class="form-label">Logradouro</label>
                                <input type="text" name="logradouro" class="form-control" 
                                       value="{{ form.logradouro.data or '' }}"
                                       placeholder="Rua, Avenida, etc.">
                            </div>
                            
                            <div class="col-md-2">
                                <label class="form-label">Número</label>
                                <input type="text" name="numero" class="form-control" 
                                       value="{{ form.numero.data or '' }}">
                            </div>
                            
                            <div class="col-md-4">
                                <label class="form-label">Complemento</label>
                                <input type="text" name="complemento" class="form-control" 
                                       value="{{ form.complemento.data or '' }}"
                                       placeholder="Apt, Bloco, etc.">
                            </div>
                            
                            <div class="col-md-4">
                                <label class="form-label">Bairro</label>
                                <input type="text" name="bairro" class="form-control" 
                                       value="{{ form.bairro.data or '' }}">
                            </div>
                            
                            <div class="col-md-4">
                                <label class="form-label">Cidade</label>
                                <input type="text" name="cidade" class="form-control" 
                                       value="{{ form.cidade.data or '' }}">
                            </div>
                            
                            <div class="col-md-2">
                                <label class="form-label">UF</label>
                                <select name="uf" class="form-select">
                                    <option value="">--</option>
                                    {% for uf in ['AC', 'AL', 'AP', 'AM', 'BA', 'CE', 'DF', 'ES', 'GO', 'MA', 'MT', 'MS', 'MG', 'PA', 'PB', 'PR', 'PE', 'PI', 'RJ', 'RN', 'RS', 'RO', 'RR', 'SC', 'SP', 'SE', 'TO'] %}
                                    <option value="{{ uf }}" {% if form.uf.data == uf %}selected{% endif %}>{{ uf }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>
                    </div>
                    
                    <div class="card-footer text-end">
                        <a href="{{ url_for('clientes_blueprint.cliente_view', cpf=cliente.cpf) }}" class="btn btn-ghost-secondary me-2">
                            Cancelar
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="ti ti-device-floppy me-1"></i> Salvar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
