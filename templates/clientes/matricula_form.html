{% extends "layouts/base.html" %}

{% block title %}{{ title }} | {{ system.app_name }}{% endblock %}

{% block content %}
<div class="page-header d-print-none">
    <div class="container-xl">
        <div class="row g-2 align-items-center">
            <div class="col">
                <div class="page-pretitle">
                    <a href="{{ url_for('clientes_blueprint.cliente_view', cpf=cliente.cpf) }}">{{ cliente.nome_completo }}</a>
                </div>
                <h2 class="page-title">
                    <i class="ti ti-certificate me-2"></i>
                    {{ title }}
                </h2>
            </div>
        </div>
    </div>
</div>

<div class="page-body">
    <div class="container-xl">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <form method="POST" class="card">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    
                    <div class="card-body">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Órgão</label>
                                <input type="text" name="orgao" class="form-control" 
                                       value="{{ form.orgao.data or '' }}"
                                       placeholder="INSS, Exército, etc.">
                            </div>
                            
                            <div class="col-md-6">
                                <label class="form-label">Matrícula</label>
                                <input type="text" name="matricula" class="form-control" 
                                       value="{{ form.matricula.data or '' }}">
                            </div>
                            
                            <div class="col-md-3">
                                <label class="form-label">Cód. Categoria</label>
                                <input type="text" name="cod_categoria" class="form-control" 
                                       value="{{ form.cod_categoria.data or '' }}">
                            </div>
                            
                            <div class="col-md-9">
                                <label class="form-label">Categoria</label>
                                <input type="text" name="categoria" class="form-control" 
                                       value="{{ form.categoria.data or '' }}"
                                       placeholder="Aposentado, Pensionista, etc.">
                            </div>
                            
                            <div class="col-md-6">
                                <label class="form-label">Indicativo</label>
                                <input type="text" name="indicativo" class="form-control" 
                                       value="{{ form.indicativo.data or '' }}">
                            </div>
                            
                            <div class="col-md-6">
                                <label class="form-label">Patente</label>
                                <input type="text" name="patente" class="form-control" 
                                       value="{{ form.patente.data or '' }}">
                            </div>
                        </div>
                    </div>
                    
                    <div class="card-footer text-end">
                        <a href="{{ url_for('clientes_blueprint.cliente_view', cpf=cliente.cpf) }}" class="btn btn-ghost-secondary me-2">
                            Cancelar
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="ti ti-device-floppy me-1"></i> Salvar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
