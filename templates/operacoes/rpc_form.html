{% extends "layouts/base.html" %}

{% block title %}{{ title }} | {{ system.app_name }}{% endblock %}

{% block content %}
<div class="page-header d-print-none">
    <div class="container-xl">
        <div class="page-pretitle">
            <a href="{{ url_for('operacoes_blueprint.operacao_view', operacao_id=operacao.id) }}">Operação #{{ operacao.id }}</a>
        </div>
        <h2 class="page-title">
            <i class="ti ti-arrows-exchange me-2"></i>
            {{ title }}
        </h2>
    </div>
</div>

<div class="page-body">
    <div class="container-xl">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <form method="POST" class="card">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    
                    <div class="card-header">
                        <h3 class="card-title">Dados do RPC</h3>
                    </div>
                    <div class="card-body">
                        <div class="row g-3">
                            <div class="col-md-4">
                                <label class="form-label required">Tipo</label>
                                <select name="tipo" class="form-select" required>
                                    {% for value, label in form.tipo.choices %}
                                    <option value="{{ value }}" {% if form.tipo.data == value %}selected{% endif %}>{{ label }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Banco</label>
                                <input type="text" name="banco" class="form-control" 
                                       value="{{ form.banco.data or '' }}">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Código Único</label>
                                <input type="text" name="codigo_unico" class="form-control" 
                                       value="{{ form.codigo_unico.data or '' }}">
                            </div>
                            
                            <div class="col-md-3">
                                <label class="form-label">Valor Parcela</label>
                                <input type="number" name="valor_parcela" class="form-control" 
                                       value="{{ form.valor_parcela.data or '' }}" step="0.01">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Parcelas Restantes</label>
                                <input type="number" name="restantes" class="form-control" 
                                       value="{{ form.restantes.data or '' }}" min="0">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Saldo Devedor</label>
                                <input type="number" name="saldo_devedor" class="form-control" 
                                       value="{{ form.saldo_devedor.data or '' }}" step="0.01">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Venc. Boleto</label>
                                <input type="date" name="boleto_vencimento" class="form-control" 
                                       value="{{ form.boleto_vencimento.data.strftime('%Y-%m-%d') if form.boleto_vencimento.data else '' }}">
                            </div>
                            
                            <div class="col-12">
                                <label class="form-label">Observações</label>
                                <textarea name="obs" class="form-control" rows="2">{{ form.obs.data or '' }}</textarea>
                            </div>
                        </div>
                    </div>
                    
                    <div class="card-footer text-end">
                        <a href="{{ url_for('operacoes_blueprint.operacao_view', operacao_id=operacao.id) }}" class="btn btn-ghost-secondary me-2">
                            Cancelar
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="ti ti-device-floppy me-1"></i> Salvar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
