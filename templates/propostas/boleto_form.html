{% extends "layouts/base.html" %}

{% block title %}{{ title }} | {{ system.app_name }}{% endblock %}

{% block content %}
<div class="page-header d-print-none">
    <div class="container-xl">
        <div class="page-pretitle">
            <a href="{{ url_for('propostas_blueprint.proposta_view', proposta_id=proposta.id) }}">Proposta #{{ proposta.id }}</a>
        </div>
        <h2 class="page-title">
            <i class="ti ti-file-dollar me-2"></i>
            {{ title }}
        </h2>
    </div>
</div>

<div class="page-body">
    <div class="container-xl">
        <form method="POST" class="card">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            
            <div class="card-header">
                <h3 class="card-title">Dados do Boleto</h3>
            </div>
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-3">
                        <label class="form-label required">Valor</label>
                        <input type="number" name="valor" class="form-control" 
                               value="{{ form.valor.data or '' }}" step="0.01" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Data</label>
                        <input type="date" name="data" class="form-control" 
                               value="{{ form.data.data.strftime('%Y-%m-%d') if form.data.data else '' }}">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Banco</label>
                        <input type="text" name="banco" class="form-control" 
                               value="{{ form.banco.data or '' }}">
                    </div>
                    <div class="col-md-3">
                        <div class="form-label">&nbsp;</div>
                        <label class="form-check">
                            <input type="checkbox" name="deposito_confirmado" class="form-check-input" 
                                   {% if form.deposito_confirmado.data %}checked{% endif %}>
                            <span class="form-check-label">Depósito Confirmado</span>
                        </label>
                    </div>
                </div>
            </div>
            
            <div class="card-header">
                <h3 class="card-title">Comissões</h3>
            </div>
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-2">
                        <label class="form-label">Empresa</label>
                        <input type="number" name="comissao_empresa" class="form-control" 
                               value="{{ form.comissao_empresa.data or '' }}" step="0.01">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Bônus</label>
                        <input type="number" name="comissao_bonus" class="form-control" 
                               value="{{ form.comissao_bonus.data or '' }}" step="0.01">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Corretor</label>
                        <input type="number" name="comissao_corretor" class="form-control" 
                               value="{{ form.comissao_corretor.data or '' }}" step="0.01">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Ger. Equipe</label>
                        <input type="number" name="comissao_ger_equipe" class="form-control" 
                               value="{{ form.comissao_ger_equipe.data or '' }}" step="0.01">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Ger. Geral 1</label>
                        <input type="number" name="comissao_ger_geral1" class="form-control" 
                               value="{{ form.comissao_ger_geral1.data or '' }}" step="0.01">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Ger. Geral 2</label>
                        <input type="number" name="comissao_ger_geral2" class="form-control" 
                               value="{{ form.comissao_ger_geral2.data or '' }}" step="0.01">
                    </div>
                    
                    <div class="col-md-2">
                        <label class="form-label">Ger. ADM</label>
                        <input type="number" name="comissao_ger_adm" class="form-control" 
                               value="{{ form.comissao_ger_adm.data or '' }}" step="0.01">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">ADM 1</label>
                        <input type="number" name="comissao_adm1" class="form-control" 
                               value="{{ form.comissao_adm1.data or '' }}" step="0.01">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">ADM 2</label>
                        <input type="number" name="comissao_adm2" class="form-control" 
                               value="{{ form.comissao_adm2.data or '' }}" step="0.01">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Líder 1</label>
                        <input type="number" name="comissao_lider1" class="form-control" 
                               value="{{ form.comissao_lider1.data or '' }}" step="0.01">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Líder 2</label>
                        <input type="number" name="comissao_lider2" class="form-control" 
                               value="{{ form.comissao_lider2.data or '' }}" step="0.01">
                    </div>
                    <div class="col-md-2">
                        <div class="form-label">&nbsp;</div>
                        <label class="form-check">
                            <input type="checkbox" name="deposito_comissao_paga" class="form-check-input" 
                                   {% if form.deposito_comissao_paga.data %}checked{% endif %}>
                            <span class="form-check-label">Comissão Paga</span>
                        </label>
                    </div>
                </div>
            </div>
            
            <div class="card-footer text-end">
                <a href="{{ url_for('propostas_blueprint.proposta_view', proposta_id=proposta.id) }}" class="btn btn-ghost-secondary me-2">
                    Cancelar
                </a>
                <button type="submit" class="btn btn-primary">
                    <i class="ti ti-device-floppy me-1"></i> Salvar
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
