{% extends "layouts/base.html" %}

{% block title %}{{ title }} | {{ system.app_name }}{% endblock %}

{% block content %}
<div class="page-header d-print-none">
    <div class="container-xl">
        <div class="page-pretitle">
            <a href="{{ url_for('propostas_blueprint.tabelas_list') }}">Tabelas</a>
        </div>
        <h2 class="page-title">
            <i class="ti ti-table me-2"></i>
            {{ title }}
        </h2>
    </div>
</div>

<div class="page-body">
    <div class="container-xl">
        <form method="POST" class="card">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            
            <div class="card-header">
                <h3 class="card-title">Identificação</h3>
            </div>
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label required">Nome</label>
                        <input type="text" name="nome" class="form-control" 
                               value="{{ form.nome.data or '' }}" required>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label required">Tipo</label>
                        <select name="tipo" class="form-select" required>
                            {% for value, label in form.tipo.choices %}
                            <option value="{{ value }}" {% if form.tipo.data == value %}selected{% endif %}>{{ label }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Órgão</label>
                        <input type="text" name="orgao" class="form-control" 
                               value="{{ form.orgao.data or '' }}" placeholder="INSS, Exército...">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Banco</label>
                        <input type="text" name="banco" class="form-control" 
                               value="{{ form.banco.data or '' }}">
                    </div>
                </div>
            </div>
            
            <div class="card-header">
                <h3 class="card-title">Parâmetros</h3>
            </div>
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-2">
                        <label class="form-label">Nº Parcelas</label>
                        <input type="number" name="num_parcelas" class="form-control" 
                               value="{{ form.num_parcelas.data or '' }}" min="1" max="999">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Fator</label>
                        <input type="number" name="fator" class="form-control" 
                               value="{{ form.fator.data or '' }}" step="0.0001">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Idade Máxima</label>
                        <input type="number" name="idade_max" class="form-control" 
                               value="{{ form.idade_max.data or '' }}" min="18" max="120">
                    </div>
                    <div class="col-md-3">
                        <div class="form-label">&nbsp;</div>
                        <label class="form-check">
                            <input type="checkbox" name="ativa" class="form-check-input" 
                                   {% if form.ativa.data %}checked{% endif %}>
                            <span class="form-check-label">Tabela Ativa</span>
                        </label>
                    </div>
                    <div class="col-md-3">
                        <div class="form-label">&nbsp;</div>
                        <label class="form-check">
                            <input type="checkbox" name="externos" class="form-check-input" 
                                   {% if form.externos.data %}checked{% endif %}>
                            <span class="form-check-label">Aceita Externos</span>
                        </label>
                    </div>
                </div>
            </div>
            
            <div class="card-header">
                <h3 class="card-title">Comissões (%)</h3>
            </div>
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-2">
                        <label class="form-label">Total</label>
                        <input type="number" name="comissao_total" class="form-control" 
                               value="{{ form.comissao_total.data or '' }}" step="0.01">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Empresa</label>
                        <input type="number" name="comissao_empresa" class="form-control" 
                               value="{{ form.comissao_empresa.data or '' }}" step="0.01">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Externos</label>
                        <input type="number" name="comissao_externos" class="form-control" 
                               value="{{ form.comissao_externos.data or '' }}" step="0.01">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Bônus</label>
                        <input type="number" name="comissao_bonus" class="form-control" 
                               value="{{ form.comissao_bonus.data or '' }}" step="0.01">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Incidência</label>
                        <input type="number" name="comissao_incidencia" class="form-control" 
                               value="{{ form.comissao_incidencia.data or '' }}" step="0.01">
                    </div>
                </div>
            </div>
            
            <div class="card-header">
                <h3 class="card-title">Observações</h3>
            </div>
            <div class="card-body">
                <textarea name="observacoes" class="form-control" rows="3">{{ form.observacoes.data or '' }}</textarea>
            </div>
            
            <div class="card-footer text-end">
                <a href="{{ url_for('propostas_blueprint.tabelas_list') }}" class="btn btn-ghost-secondary me-2">
                    Cancelar
                </a>
                <button type="submit" class="btn btn-primary">
                    <i class="ti ti-device-floppy me-1"></i> Salvar
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
