{% extends "settings/index.html" %}

{% block settings_content %}
<div class="card border-0 shadow mb-4">
    <div class="card-header border-bottom">
        <h3 class="h5 mb-0"><i class="fas fa-globe me-2"></i> Localização</h3>
    </div>
    <div class="card-body">
        <form method="POST">
            {{ form.hidden_tag() }}
            
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label" for="language">Idioma Padrão</label>
                    {{ form.language(class="form-select") }}
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label" for="timezone">Fuso Horário</label>
                    {{ form.timezone(class="form-select") }}
                </div>
            </div>
            
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label" for="date_format">Formato de Data</label>
                    {{ form.date_format(class="form-select") }}
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label" for="currency">Moeda</label>
                    {{ form.currency(class="form-select") }}
                </div>
            </div>
            
            <div class="mt-4 d-flex gap-2">
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save me-2"></i> Salvar Configurações
                </button>
                <a href="{{ url_for('settings_blueprint.index') }}" class="btn btn-outline-secondary">
                    <i class="fas fa-arrow-left me-2"></i> Voltar
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
